services:
  logan-lp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logan-lp-advocacia
    restart: unless-stopped
    ports:
      - "${PORT:-3055}:3055"
    environment:
      - PORT=3055
      - NODE_ENV=production
      - LEAD_WEBHOOK_URL=${LEAD_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3055/health"]
      interval: 30s
      timeout: 5s
      retries: 3
